<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Eli Cottrell — creative generalist, founder, builder, and designer." />
    <title>Eli Cottrell — Creative Generalist</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/script.js" defer></script>
  </head>
  <body class="home-page">
    <main class="home-shell">
      <section class="profile-card" aria-labelledby="profile-name">
        <p class="profile-intro">Founder, builder, and designer currently crafting ambitious ideas, sharp systems, and beautiful products of execution.</p>
        <div class="profile-identity">
          <h1 id="profile-name">Eli Cottrell</h1>
          <p>Creative Generalist</p>
          <div class="social-marks" aria-label="Social links coming soon">
            <img src="/assets/twitter.svg" alt="" />
            <img src="/assets/mail.svg" alt="" />
            <img src="/assets/github.svg" alt="" />
            <img src="/assets/instagram.svg" alt="" />
          </div>
        </div>
      </section>
      <section class="home-content" aria-label="Portfolio navigation">
        <form class="update-form" data-unwired-form>
          <label class="sr-only" for="update-email">Email for updates</label>
          <input id="update-email" type="email" placeholder="Enter email for updates…" />
          <button type="submit">Submit</button>
          <p class="form-note" role="status" hidden>Updates are not connected yet.</p>
        </form>
        <nav class="destination-menu">
          <div class="menu-item menu-item-muted"><span>Seedcore</span><img src="/assets/circle-dot.svg" alt="" /></div>
          <a class="menu-item" href="/about"><span>About</span><img src="/assets/circle-dot.svg" alt="" /></a>
          <a class="menu-item" href="/projects"><span>Projects</span><img src="/assets/circle-dot.svg" alt="" /></a>
          <a class="menu-item" href="/skills"><span>Skills</span><img src="/assets/circle-dot.svg" alt="" /></a>
          <div class="menu-item menu-item-muted"><span>Contact</span><img src="/assets/circle-dot.svg" alt="" /></div>
        </nav>
        <footer class="home-footer" aria-label="Additional links"><span>CONTACT</span><span>WEBSITE</span><span>RESUME</span></footer>
      </section>
    </main>
  </body>
</html>
